name: Infrastructure

on:
  pull_request:
    paths:
      - "infra/**"
  push:
    branches: [main]
    paths:
      - "infra/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    if: github.event_name != 'workflow_dispatch'
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    uses: dexteryo/d-github-actions/.github/workflows/terraform.yml@v0.3.0
    with:
      working-directory: infra
      roots: |
        envs/example
      terraform-version: "1.15.3"
      aws-region: eu-west-1
      plan-role-to-assume: arn:aws:iam::123456789012:role/example-terraform-plan

  apply:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    uses: dexteryo/d-github-actions/.github/workflows/terraform.yml@v0.3.0
    with:
      working-directory: infra
      roots: |
        envs/example
      terraform-version: "1.15.3"
      aws-region: eu-west-1
      plan-role-to-assume: arn:aws:iam::123456789012:role/example-terraform-plan
      apply-role-to-assume: arn:aws:iam::123456789012:role/example-terraform-apply
      apply: true
      environment: example
