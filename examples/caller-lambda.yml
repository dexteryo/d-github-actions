name: Deploy the intake function

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: integration
    concurrency:
      group: intake-deploy-integration
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci && npm run build
      - uses: dexteryo/d-github-actions/actions/lambda-deploy@v0.4.0
        with:
          aws-region: eu-west-1
          role-to-assume: arn:aws:iam::123456789012:role/example-integration-deploy
          function-name: ordering-integration-intake
          package-directory: dist
          package-files: |
            intake.cjs
