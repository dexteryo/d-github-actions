name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12 && ./actionlint -color
      - name: shellcheck
        run: shellcheck scripts/*.sh tests/*.sh
      - name: task definition rewrite tests
        run: tests/rewrite-task-definition.test.sh
      - name: deployment check tests
        run: tests/check-deployment.test.sh
      - name: promotion plan tests
        run: tests/promotion-plan.test.sh
      - name: terraform plan summary tests
        run: tests/terraform-plan-summary.test.sh
      - name: terraform plan comment tests
        run: tests/terraform-plan-comment.test.sh
      - name: pull request comment upsert tests
        run: tests/upsert-pr-comment.test.sh
      - name: foreign identifier check
        run: scripts/check-no-foreign-identifiers.sh --git
      - name: foreign identifier check tests
        run: tests/check-no-foreign-identifiers.test.sh
