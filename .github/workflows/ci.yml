name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12 && ./actionlint -color
      - name: shellcheck
        run: shellcheck scripts/*.sh tests/*.sh
      - name: task definition rewrite tests
        run: tests/rewrite-task-definition.test.sh
      - name: deployment check tests
        run: tests/check-deployment.test.sh
