name: ECR push image archive
description: Load an image archive built earlier and push it to Amazon ECR using GitHub OIDC. The digest is fixed by the first push, so every later deploy references the same image.

inputs:
  aws-region:
    description: AWS region of the ECR registry
    required: true
  role-to-assume:
    description: ARN of the IAM role to assume through GitHub OIDC
    required: true
  ecr-repository:
    description: ECR repository name (without registry host)
    required: true
  image-path:
    description: Path of the image archive produced by ecr-build-push with push set to "false"
    required: true
  image-tag:
    description: Tag to push. Defaults to the commit SHA
    required: false
    default: ""

outputs:
  image-uri:
    description: Immutable image reference in the form registry/repository@sha256:digest
    value: ${{ steps.push.outputs.image-uri }}
  image-digest:
    description: Digest of the pushed image
    value: ${{ steps.push.outputs.image-digest }}
  image-tag:
    description: Tag that was pushed
    value: ${{ steps.push.outputs.image-tag }}

runs:
  using: composite
  steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        aws-region: ${{ inputs.aws-region }}
        role-to-assume: ${{ inputs.role-to-assume }}

    - name: Log in to Amazon ECR
      id: ecr
      uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

    - name: Push
      id: push
      shell: bash
      env:
        REGISTRY: ${{ steps.ecr.outputs.registry }}
        REPOSITORY: ${{ inputs.ecr-repository }}
        IMAGE_PATH: ${{ inputs.image-path }}
        IMAGE_TAG: ${{ inputs.image-tag }}
        DEFAULT_TAG: ${{ github.sha }}
      run: |
        set -euo pipefail
        tag=${IMAGE_TAG:-$DEFAULT_TAG}
        loaded=$(docker load --input "$IMAGE_PATH" | sed -n 's/^Loaded image: //p' | tail -n 1)
        target="${REGISTRY}/${REPOSITORY}:${tag}"
        docker tag "$loaded" "$target"
        docker push "$target"
        digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$target" | sed 's/.*@//')
        {
          echo "image-uri=${REGISTRY}/${REPOSITORY}@${digest}"
          echo "image-digest=${digest}"
          echo "image-tag=${tag}"
        } >> "$GITHUB_OUTPUT"
