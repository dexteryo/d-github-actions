name: Terraform plan
description: Plan a root module with a read-only role, summarise the result and post it as a pull request comment that is edited in place.

inputs:
  working-directory:
    description: Root module directory, relative to the repository root
    required: true
  terraform-version:
    description: Terraform version to install
    required: true
  aws-region:
    description: AWS region
    required: true
  role-to-assume:
    description: ARN of the IAM role trusted for this repository through GitHub OIDC
    required: true
  lock:
    description: Take the state lock, "true" or "false". Leave it false for read-only roles, which cannot write the lock
    default: "false"
  comment-on-pull-request:
    description: Post the plan as a pull request comment, "true" or "false"
    default: "true"
  title:
    description: Heading of the summary and of the pull request comment
    default: Terraform plan
  github-token:
    description: Token used to post the pull request comment
    default: ${{ github.token }}

outputs:
  result:
    description: no-changes, changes, outputs-only or failed
    value: ${{ steps.summary.outputs.result }}
  summary:
    description: One-line summary of the plan
    value: ${{ steps.summary.outputs.summary }}

runs:
  using: composite
  steps:
    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ inputs.terraform-version }}
        terraform_wrapper: false

    - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-region: ${{ inputs.aws-region }}

    - name: terraform init
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TF_IN_AUTOMATION: "true"
        TF_INPUT: "false"
      run: terraform init

    - name: terraform plan
      id: plan
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        LOCK: ${{ inputs.lock }}
        PLAN_LOG: ${{ runner.temp }}/terraform-plan.log
        TF_IN_AUTOMATION: "true"
        TF_INPUT: "false"
      run: |
        set -euo pipefail
        exit_code=0
        terraform plan -no-color -lock="$LOCK" -detailed-exitcode -out=tfplan > "$PLAN_LOG" 2>&1 || exit_code=$?
        echo "exit-code=$exit_code" >> "$GITHUB_OUTPUT"

    - name: Summarise
      id: summary
      shell: bash
      env:
        EXIT_CODE: ${{ steps.plan.outputs.exit-code }}
        PLAN_LOG: ${{ runner.temp }}/terraform-plan.log
        COMMENT_BODY: ${{ runner.temp }}/terraform-plan.md
        TITLE: ${{ inputs.title }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        summary=$("$ACTION_PATH/../../scripts/terraform-plan-summary.sh" "$EXIT_CODE" "$PLAN_LOG")
        case "$EXIT_CODE" in
          0) result=no-changes ;;
          2) if [ "$summary" = "Changes to outputs only." ]; then result=outputs-only; else result=changes; fi ;;
          *) result=failed ;;
        esac
        "$ACTION_PATH/../../scripts/terraform-plan-comment.sh" "$summary" "$PLAN_LOG" "$TITLE" > "$COMMENT_BODY"
        cat "$COMMENT_BODY" >> "$GITHUB_STEP_SUMMARY"
        {
          echo "result=$result"
          echo "summary=$summary"
        } >> "$GITHUB_OUTPUT"

    - name: Comment on the pull request
      if: always() && github.event_name == 'pull_request' && inputs.comment-on-pull-request == 'true' && steps.summary.outcome == 'success'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPOSITORY: ${{ github.repository }}
        COMMENT_BODY: ${{ runner.temp }}/terraform-plan.md
      run: gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body-file "$COMMENT_BODY" --edit-last --create-if-none

    - name: Fail when the plan failed
      shell: bash
      env:
        RESULT: ${{ steps.summary.outputs.result }}
      run: |
        if [ "$RESULT" = "failed" ]; then
          echo "::error::terraform plan failed"
          exit 1
        fi
