name: Environment power
description: Start or stop a non-production environment now by replaying the targets of the env-schedule schedules in a schedule group, through GitHub OIDC.

inputs:
  aws-region:
    description: AWS region of the schedule group
    required: true
  role-to-assume:
    description: ARN of the operator role of the env-schedule module of d-tf-modules (output operator_role_arn)
    required: true
  schedule-group:
    description: Name of the schedule group, the schedule_group_name output of env-schedule
    required: true
  action:
    description: start or stop
    required: true
  wait:
    description: Wait until databases are available and services have settled
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        aws-region: ${{ inputs.aws-region }}
        role-to-assume: ${{ inputs.role-to-assume }}

    - name: Start or stop the environment
      shell: bash
      env:
        SCHEDULE_GROUP: ${{ inputs.schedule-group }}
        POWER_ACTION: ${{ inputs.action }}
        WAIT: ${{ inputs.wait }}
        ACTION_PATH: ${{ github.action_path }}
      run: '"$ACTION_PATH/../../scripts/env-power.sh" "$SCHEDULE_GROUP" "$POWER_ACTION" "$WAIT"'
