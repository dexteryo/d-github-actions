name: Terraform gate
description: Run terraform fmt, terraform validate in every root module, tflint and checkov. Does not check out the repository.

inputs:
  working-directory:
    description: Directory that contains the Terraform code, relative to the repository root
    default: .
  roots:
    description: Root module directories to validate, one per line, relative to working-directory
    required: true
  terraform-version:
    description: Terraform version to install
    required: true
  tflint:
    description: Run tflint recursively, "true" or "false"
    default: "true"
  checkov:
    description: Run checkov, "true" or "false"
    default: "true"
  checkov-version:
    description: checkov version installed with pip
    default: 3.3.29

runs:
  using: composite
  steps:
    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ inputs.terraform-version }}
        terraform_wrapper: false

    - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      if: inputs.tflint == 'true'

    - name: terraform fmt
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: terraform fmt -check -recursive

    - name: terraform validate
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ROOTS: ${{ inputs.roots }}
        TF_IN_AUTOMATION: "true"
        TF_INPUT: "false"
      run: |
        set -euo pipefail
        while IFS= read -r root; do
          [ -n "$root" ] || continue
          echo "::group::$root"
          terraform -chdir="$root" init -backend=false
          terraform -chdir="$root" validate
          echo "::endgroup::"
        done <<<"$ROOTS"

    - name: tflint
      if: inputs.tflint == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: tflint --init && tflint --recursive

    - name: checkov
      if: inputs.checkov == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CHECKOV_VERSION: ${{ inputs.checkov-version }}
      run: pip install --disable-pip-version-check "checkov==${CHECKOV_VERSION}" && checkov -d .
